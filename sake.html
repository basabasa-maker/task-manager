<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>日本酒テイスティングログ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本酒ログ">
<meta name="theme-color" content="#16213e">
<link rel="icon" type="image/png" sizes="180x180" href="sake-icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="sake-icon-180.png">
<link rel="manifest" href="sake-manifest.json">
<style>
* { margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; background: #1a1a2e; }
iframe {
  width: 100%;
  height: 100%;
  border: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
}
.loading {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  background: #1a1a2e;
  z-index: 10;
  transition: opacity 0.3s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading p { color: #e2b04a; font-family: -apple-system, sans-serif; font-size: 16px; }
.loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(226,176,74,0.3);
  border-top-color: #e2b04a;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #1a1a2e;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  padding: 24px;
  text-align: center;
  z-index: 20;
}
.error-box.show { display: flex; }
.error-box p { color: #a0b4cc; font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.6; }
.error-box a {
  display: inline-block;
  padding: 12px 32px;
  background: #e2b04a;
  color: #16213e;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  font-family: -apple-system, sans-serif;
  font-size: 16px;
}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>
<div class="error-box" id="errorBox">
  <p>アプリの読み込みに失敗しました。<br>下のボタンから直接開いてください。</p>
  <a href="https://script.google.com/macros/s/AKfycbyIQoZO94pGIYZiEy_2X73pT-v5MbjwWWi9CJ9jmpIsVOap7ew7btoHdSIKTvCEepdA/exec">アプリを開く</a>
</div>
<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbyIQoZO94pGIYZiEy_2X73pT-v5MbjwWWi9CJ9jmpIsVOap7ew7btoHdSIKTvCEepdA/exec"
  allow="camera"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
  loading="eager"
></iframe>
<script>
var iframe = document.getElementById('app');
var loading = document.getElementById('loading');
var errorBox = document.getElementById('errorBox');

iframe.addEventListener('load', function() {
  loading.classList.add('hidden');
});

// 10秒でタイムアウト → フォールバック表示
setTimeout(function() {
  if (!loading.classList.contains('hidden')) {
    loading.style.display = 'none';
    errorBox.classList.add('show');
  }
}, 10000);
</script>
</body>
</html>
